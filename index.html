<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSI Hotel — Intranet</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<style>
  * { box-sizing: border-box; }
  /* Mobile : Safari iOS zoome automatiquement sur tout champ dont la police est
     < 16px au moment du focus. On force 16px sur téléphone uniquement. */
  @media (max-width: 768px) {
    input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),
    select, textarea, [contenteditable="true"] { font-size: 16px !important; }
  }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  /* Rendu des descriptions de fiches Infrastructure contenant du HTML (tableaux). */
  .dsi-desc-html { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .dsi-desc-html table { border-collapse: collapse; width: 100%; max-width: 100%; margin: 4px 0 8px; font-size: 11.5px; }
  .dsi-desc-html th, .dsi-desc-html td { border: 1px solid #E2E2E8; padding: 4px 8px; text-align: left; vertical-align: top; word-break: break-word; overflow-wrap: anywhere; }
  .dsi-desc-html th { background: #F4F4F9; color: #444; font-weight: 600; }
  .dsi-desc-html tr:nth-child(even) td { background: #FAFAFC; }
  .dsi-desc-html h3, .dsi-desc-html h4 { margin: 10px 0 4px; font-size: 12.5px; color: #1a1a3e; }
  .dsi-desc-html ul, .dsi-desc-html ol { margin: 4px 0 8px; padding-left: 18px; }
  .dsi-desc-html hr { border: none; border-top: 1px solid #E2E2E8; margin: 8px 0; }
  .dsi-desc-html code { background: #F0F0F5; padding: 1px 4px; border-radius: 3px; font-size: 11px; word-break: break-all; }

  /* ====== MODE NUIT (bascule par utilisateur, memorise localStorage) ====== */
  html.dsi-dark { background: #14142e; }
  html.dsi-dark body { background: #14142e; }
  html.dsi-dark #root { filter: invert(0.92) hue-rotate(180deg); }
  html.dsi-dark #root img, html.dsi-dark #root video, html.dsi-dark #root canvas,
  html.dsi-dark #root svg, html.dsi-dark #root iframe,
  html.dsi-dark #root [data-no-invert], html.dsi-dark #root .dsi-no-invert { filter: invert(1) hue-rotate(180deg); }
  [contenteditable][data-ph]:empty:before { content: attr(data-ph); color: #b3b3c4; pointer-events: none; display: block; }
  .pin-red{width:20px;height:20px;border-radius:50% 50% 50% 0;background:#E5484D;border:2.5px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .leaflet-tooltip.htip{background:#1a1a3e;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:12.5px;padding:5px 9px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .leaflet-tooltip.htip::before{border-top-color:#1a1a3e}
  .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(229,72,77,.25)}
  .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:#E5484D;color:#fff;font-weight:700}
  @keyframes dsiPulseRouge{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,.6)}50%{box-shadow:0 0 0 7px rgba(229,62,62,0)}}
  /* ====== MENU : barre horizontale + méga-menu (ordinateur), onglets en bas (mobile) ====== */
  .dsi-top{height:42px;padding:0 13px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s}
  .dsi-top:hover{background:rgba(255,255,255,.08);color:#fff}
  .dsi-top.cur{color:#E7C977}
  .dsi-top.cur::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:2px;border-radius:2px;background:#C9A84C}
  .dsi-top.open{background:rgba(201,168,76,.16);color:#E7C977}
  .dsi-top .dsi-chev{display:flex;transition:transform .2s}
  .dsi-top.open .dsi-chev{transform:rotate(180deg)}
  .dsi-topnav{scrollbar-width:none}.dsi-topnav::-webkit-scrollbar{display:none}
  .dsi-iconbtn{width:36px;height:36px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;transition:background .15s}
  .dsi-iconbtn:hover{background:rgba(201,168,76,.2)}
  .dsi-mega{animation:dsiDrop .2s ease}
  @keyframes dsiDrop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .dsi-tile{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:0;border-radius:12px;background:transparent;text-align:left;font:inherit;cursor:pointer;width:100%;transition:background .15s,transform .15s}
  .dsi-tile:hover{background:#F6F4EC;transform:translateY(-1px)}
  .dsi-tile.on{background:#FBF3DF}
  .dsi-tico{width:38px;height:38px;flex-shrink:0;border-radius:10px;background:#0F0F24;color:#C9A84C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .dsi-tile:hover .dsi-tico{transform:scale(1.06)}
  .dsi-veil{animation:dsiFade .2s ease}
  @keyframes dsiFade{from{opacity:0}to{opacity:1}}
  .dsi-tab{flex:1;min-width:0;height:56px;border:0;background:transparent;font:inherit;font-size:10.5px;font-weight:600;color:#A4A7C0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
  .dsi-tab .dsi-pill{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .dsi-tab.on{color:#C9A84C}
  .dsi-tab.on .dsi-pill{background:rgba(201,168,76,.18)}
  .dsi-tab span.dsi-tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
  .dsi-sheet{animation:dsiUp .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes dsiUp{from{transform:translateY(100%)}to{transform:none}}
  .dsi-mtile{border:0;background:#F4F5FA;border-radius:14px;padding:12px 6px 10px;font:inherit;font-size:11.5px;font-weight:600;color:#1F2340;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;line-height:1.25;cursor:pointer;min-height:84px;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .12s}
  .dsi-mtile:active{transform:scale(.96)}
  .dsi-mtile.on{background:#FBF3DF;color:#7A5A12}
  .dsi-mtile .dsi-tico{width:36px;height:36px;border-radius:12px}
  html.dsi-dark #root svg.dsi-ico{filter:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Version des fichiers JS : À CHANGER À CHAQUE DÉPLOIEMENT (évite qu'un navigateur garde un ancien fichier en cache)
window.DSI_VERSION = "2026-11-12-4";
// Ordre de chargement : core.js d'abord, puis les pages, app.js en dernier (async=false garde l'ordre)
[
  "js/core.js",
  "js/pages/capex.js",
  "js/pages/suppr-ticket.js",
  "js/pages/accueil.js",
  "js/pages/client-admin.js",
  "js/pages/admins.js",
  "js/pages/login-logs.js",
  "js/pages/securite.js",
  "js/pages/ninjaone.js",
  "js/pages/proc-admin.js",
  "js/pages/knowledge.js",
  "js/pages/proc-detail.js",
  "js/pages/templates.js",
  "js/pages/contact.js",
  "js/pages/tickets-admin.js",
  "js/pages/tickets-client.js",
  "js/pages/docs-techniques.js",
  "js/pages/mon-installation.js",
  "js/pages/rapport-securite.js",
  "js/pages/rapport-jour.js",
  "js/pages/historique-comptes.js",
  "js/pages/planning.js",
  "js/pages/backups.js",
  "js/pages/checklist.js",
  "js/pages/inventaire.js",
  "js/pages/sophos.js",
  "js/pages/m365.js",
  "js/pages/rapport-tickets.js",
  "js/pages/rapport-tickets-superviseur.js",
  "js/pages/licences-m365.js",
  "js/pages/rapport-intervention.js",
  "js/pages/projets.js",
  "js/pages/rapports.js",
  "js/pages/reponses-types.js",
  "js/pages/aide-interne.js",
  "js/app.js"
].forEach(function (f) {
  var s = document.createElement("script");
  s.src = f + "?v=" + window.DSI_VERSION;
  s.async = false;
  s.onerror = function () { document.body.insertAdjacentHTML("afterbegin", '<div style="padding:16px;background:#fee;color:#900;font-family:sans-serif">Erreur de chargement : ' + f + ' — rechargez la page (Ctrl+F5).</div>'); };
  document.body.appendChild(s);
});
</script>
</body>
</html>
