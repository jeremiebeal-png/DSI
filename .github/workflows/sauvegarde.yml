# Sauvegarde nocturne : dépôt GitHub (historique complet) + code des Workers Cloudflare
# → SharePoint DSI-Backups (Documents/GitHub et Documents/Workers), rétention 30 jours.
# Secrets requis : AZ_TENANT_ID, AZ_CLIENT_ID, AZ_CLIENT_SECRET, SP_SITE, CF_API_TOKEN, CF_ACCOUNT_IDS
name: Sauvegarde SharePoint

on:
  schedule:
    - cron: "13 2 * * *"   # chaque nuit vers 3h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # historique complet pour le bundle
      - name: Sauvegarder vers SharePoint
        env:
          AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
          AZ_CLIENT_ID: ${{ secrets.AZ_CLIENT_ID }}
          AZ_CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET }}
          SP_SITE: ${{ secrets.SP_SITE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_IDS: ${{ secrets.CF_ACCOUNT_IDS }}
        run: python3 .github/scripts/sauvegarde.py
