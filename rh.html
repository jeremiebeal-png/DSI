const TYPES = [
  { v: "CP", l: "Congés payés", c: "#2F855A", bg: "#E6F6EA", court: "CP" },
  { v: "Sans solde", l: "Congé sans solde", c: "#6B46C1", bg: "#F3EEFC", court: "SS" },
  { v: "Événement familial", l: "Événement familial", c: "#B7791F", bg: "#FFF6E5", court: "EF" },

  { v: "Naissance / paternité", l: "Congé naissance / paternité", c: "#2C7A7B", bg: "#E6FFFA", court: "N" },
  { v: "Maternité", l: "Congé maternité", c: "#B83280", bg: "#FDEDF5", court: "Ma" },

];
const typeDe = (v) => TYPES.find(t => t.v === v) || TYPES[TYPES.length - 1];
const STATUTS = {

  approuve: { l: "Validée", c: "#2F855A", bg: "#E6F6EA" },

};
const CONTRATS = {

};
const ANNEAU = { dispo: "#2F855A", pris: "#A0AEC0", attente: "#D69E2E", vide: "#E8E8F0" };
const MOIS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

// ---------- Dates (chaînes AAAA-MM-JJ, calcul en UTC pour éviter les décalages d'heure) ----------
const s2d = (s) => new Date(s + "T00:00:00Z");
const d2s = (d) => d.toISOString().slice(0, 10);
const ajout = (s, n) => { const d = s2d(s); d.setUTCDate(d.getUTCDate() + n); return d2s(d); };
const aujourdhui = () => { const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); };
const finMois = (a, m) => d2s(new Date(Date.UTC(a, m, 0)));
function paques(a) {
  const b = Math.floor(a / 100), c = a % 100, d = Math.floor(b / 4), ee = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * (a % 19) + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * ee + 2 * i - h - k) % 7, m = Math.floor(((a % 19) + 11 * h + 22 * l) / 451);
  return new Date(Date.UTC(a, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1));
}
const _feries = {};
function feriesAnnee(a) {
  if (_feries[a]) return _feries[a];
  const p = d2s(paques(a));
  const set = new Set(["01-01", "05-01", "05-08", "07-14", "08-15", "11-01", "11-11", "12-25"].map(x => a + "-" + x));
  [1, 39, 50].forEach(n => set.add(ajout(p, n)));
  return (_feries[a] = set);
}
const estFerie = (s) => feriesAnnee(+s.slice(0, 4)).has(s);
const estWeekend = (s) => { const j = s2d(s).getUTCDay(); return j === 0 || j === 6; };
const estOuvre = (s) => !estWeekend(s) && !estFerie(s);
function nbJours(debut, fin, am, fm) {
  if (!debut || !fin || fin < debut) return 0;
  let n = 0;
  for (let s = debut; s <= fin; s = ajout(s, 1)) if (estOuvre(s)) n++;
  if (am && estOuvre(debut)) n -= 0.5;
  if (fm && estOuvre(fin)) n -= 0.5;
  return Math.max(n, 0);
}
// Jours d'une demande compris entre a et b (pour l'export paie mensuel).
function joursEntre(d, a, b) {
  const deb = d.date_debut < a ? a : d.date_debut, fin = d.date_fin > b ? b : d.date_fin;
  if (fin < deb) return 0;
  return nbJours(deb, fin, d.debut_apres_midi && deb === d.date_debut, d.fin_matin && fin === d.date_fin);
}
// Même calcul que rh_acquis() en SQL (aperçu dans la fiche).
function acquisJS(entree, fin, contrat, joursStage, annee, jusqua) {
  if (!entree) return 0;
  if (contrat === "Stage") return (+entree.slice(0, 4) === annee && entree <= jusqua) ? Number(joursStage || 0) : 0;
  let s = 0, complet = true;
  for (let m = 1; m <= 12; m++) {
    const ms = annee + "-" + String(m).padStart(2, "0") + "-01", me = finMois(annee, m);
    const a = entree > ms ? entree : ms, b = (fin && fin < me) ? fin : me;
    if (b < a) continue;
    if (b > jusqua) { complet = false; continue; }
    const nbm = +me.slice(8), nb = (s2d(b) - s2d(a)) / 864e5 + 1;
    s += nb / nbm * 25 / 12;
  }
  s = Math.round(s * 100) / 100;
  if (complet && s !== Math.trunc(s)) s = Math.ceil(s);
  return s;
}
const fmtDate = (s, long) => s ? s2d(s).toLocaleDateString("fr-FR", { timeZone: "UTC", weekday: "short", day: "numeric", month: long ? "long" : "short", year: long ? "numeric" : undefined }) : "—";
const fmtCourt = (s) => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "—";
const arr1 = (n) => Math.round(Number(n || 0) * 10) / 10;
const fmtJ = (n) => arr1(n).toLocaleString("fr-FR") + " j";
const num = (v) => { const x = Number(String(v == null ? "" : v).replace(",", ".").trim()); return isNaN(x) ? null : x; };
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function descDates(d) {
  if (d.date_debut === d.date_fin) {
    return "le " + fmtDate(d.date_debut, true) + (d.debut_apres_midi ? " (après-midi)" : d.fin_matin ? " (matin)" : "");
  }
  return "du " + fmtDate(d.date_debut, true) + (d.debut_apres_midi ? " (après-midi)" : "") +
    " au " + fmtDate(d.date_fin, true) + (d.fin_matin ? " (matin)" : "");
}
const libType = (t, contrat) => t === "CP" && contrat === "Stage" ? "Congés de stage" : typeDe(t).l;

// ---------- Emails (Worker dsi-hotel-api-v2, route /send) ----------
async function envoyerEmail(payload) {
  try {
    if (!payload.to) return;
    const { data } = await sb.auth.getSession();
    await fetch(EMAIL_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + ((data.session && data.session.access_token) || "") },
      body: JSON.stringify({ fromName: "Portail RH DSI Hotel", ...payload }),
    });
  } catch (ex) { /* l'email est un plus : l'action reste enregistrée */ }
}
function emailHtml(titre, lignes, bouton) {
  return '<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:auto;color:#333;font-size:14px">' +
    '<div style="background:#0F0F24;color:#C9A84C;padding:14px 18px;border-radius:10px 10px 0 0;font-weight:bold">' + esc(titre) + '</div>' +
    '<div style="border:1px solid #E8E8F0;border-top:none;border-radius:0 0 10px 10px;padding:18px;line-height:1.6">' +
    lignes.filter(Boolean).map(l => '<p style="margin:0 0 10px">' + l + '</p>').join("") +
    (bouton ? '<p style="text-align:center;margin:18px 0 4px"><a href="' + PAGE_URL + '" style="display:inline-block;background:#C9A84C;color:#111;text-decoration:none;padding:10px 20px;border-radius:8px;font-weight:bold">' + esc(bouton) + '</a></p>' : "") +
    '</div></div>';
}
const emailA = (dest, subject, titre, lignes, bouton, replyTo) => {
  const liste = (dest || []).filter(Boolean);
  if (!liste.length) return;
  envoyerEmail({
    to: liste[0], cc: liste.slice(1), replyTo, subject,
    text: lignes.filter(Boolean).map(l => l.replace(/<[^>]+>/g, "")).join("\n") + "\n\n" + PAGE_URL,
    html: emailHtml(titre, lignes, bouton),
  });
};

// ---------- Petits éléments d'interface ----------
const bouton = (couleur, plein) => ({
  padding: "8px 14px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap",
  border: "1px solid " + (plein ? couleur : "#DDE0EA"), background: plein ? couleur : "white", color: plein ? (couleur === G ? "#111" : "white") : (couleur || "#555"),
});
const petit = { padding: "5px 10px", fontSize: 12 };
const champ = { width: "100%", padding: "9px 11px", border: "1px solid #DDD", borderRadius: 8, fontSize: 13.5, background: "white" };
const etiquette = { display: "block", fontSize: 11.5, fontWeight: 600, color: "#555", margin: "12px 0 5px" };
const carte = { background: "white", border: "1px solid #E8E8F0", borderRadius: 12 };
const pastille = (txt, c, bg) => e('span', { style: { display: "inline-block", fontSize: 11, fontWeight: 700, color: c, background: bg, padding: "2px 9px", borderRadius: 20, whiteSpace: "nowrap" } }, txt);
const pastilleStatut = (s) => { const m = STATUTS[s] || STATUTS.annule; return pastille(m.l, m.c, m.bg); };
const pastilleType = (t, contrat) => { const m = typeDe(t); return pastille(libType(t, contrat), m.c, m.bg); };
const pastilleContrat = (c) => { const m = CONTRATS[c] || CONTRATS.CDI; return pastille(c, m.c, m.bg); };
const point = (c, bordure) => e('span', { style: { display: "inline-block", width: 10, height: 10, borderRadius: 3, background: c, border: bordure ? "1px solid #CBD0DC" : "none", marginRight: 7, flex: "0 0 auto" } });

function Fenetre({ titre, onFermer, children, large }) {
  return e('div', { onClick: (ev) => { if (ev.target === ev.currentTarget) onFermer(); }, style: { position: "fixed", inset: 0, background: "rgba(15,15,36,.55)", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "40px 14px", zIndex: 100, overflowY: "auto" } },
    e('div', { style: { ...carte, width: large ? 680 : 480, maxWidth: "100%", padding: 22, boxShadow: "0 12px 40px rgba(0,0,0,.25)" } },
      e('div', { style: { display: "flex", alignItems: "center", marginBottom: 6 } },
        e('div', { style: { fontSize: 16, fontWeight: 700, flex: 1 } }, titre),
        e('button', { onClick: onFermer, style: { border: "none", background: "none", fontSize: 18, cursor: "pointer", color: "#999" } }, "✕")),
      children));
}

// Anneau des congés payés (option A) : disponibles / pris / en attente / encore à acquérir.
function Anneau({ s, taille }) {
  const T = taille || 156, ep = T > 100 ? 15 : 8, r = T / 2 - ep / 2 - 2, C = 2 * Math.PI * r, cx = T / 2;
  const dispo = Math.max(0, Number(s.disponible)), pris = Math.max(0, Number(s.pris)), att = Math.max(0, Number(s.attente)), aacq = Math.max(0, Number(s.a_acquerir));
  const total = dispo + pris + att + aacq || 1;
  let off = 0;
  const seg = (v, c, k) => {
    const L = v / total * C;
    const el = L > 0.01 ? e('circle', { key: k, cx, cy: cx, r, fill: "none", stroke: c, strokeWidth: ep, strokeDasharray: L + " " + C, strokeDashoffset: -off, transform: "rotate(-90 " + cx + " " + cx + ")" }) : null;
    off += L; return el;
  };
  const neg = Number(s.disponible) < 0;
  return e('svg', { width: T, height: T, viewBox: "0 0 " + T + " " + T, role: "img", "aria-label": fmtJ(s.disponible) + " disponibles" },
    e('circle', { cx, cy: cx, r, fill: "none", stroke: ANNEAU.vide, strokeWidth: ep }),
    seg(dispo, ANNEAU.dispo, "d"), seg(pris, ANNEAU.pris, "p"), seg(att, ANNEAU.attente, "a"),
    T > 100
      ? [e('text', { key: "v", x: cx, y: cx + 4, textAnchor: "middle", style: { fontSize: 28, fontWeight: 800, fill: neg ? "#C53030" : "#1a1a3e" } }, arr1(s.disponible).toLocaleString("fr-FR")),
         e('text', { key: "l", x: cx, y: cx + 24, textAnchor: "middle", style: { fontSize: 11.5, fill: "#888" } }, "jours disponibles")]
      : e('text', { x: cx, y: cx + 3.5, textAnchor: "middle", style: { fontSize: 10, fontWeight: 800, fill: neg ? "#C53030" : "#1a1a3e" } }, Math.round(Number(s.disponible))));
}

// =====================================================================
//  Écran principal RH
// =====================================================================
function RH({ session, role }) {
  const monEmail = String(session.user.email || "").toLowerCase();
  const auj = aujourdhui();
  const [onglet, setOnglet] = useState("moi");
  const [annee, setAnnee] = useState(+auj.slice(0, 4));
  const [personnes, setPersonnes] = useState([]);
  const [demandes, setDemandes] = useState([]);
  const [soldes, setSoldes] = useState([]);
  const [planning, setPlanning] = useState([]);
  const [chargement, setChargement] = useState(true);
  const [erreur, setErreur] = useState("");
  const [message, setMessage] = useState("");
  const [occupe, setOccupe] = useState(false);
  const [form, setForm] = useState(null);         // nouvelle demande / modification / saisie pour un salarié
  const [formErr, setFormErr] = useState("");
  const [dejaAbsents, setDejaAbsents] = useState([]);
  const [refus, setRefus] = useState(null);       // { d, motif, mode: "refuse" | "maintenir" | "annule" | "demande_annulation" }
  const [fiche, setFiche] = useState(null);       // fiche salarié en édition
  const [ficheErr, setFicheErr] = useState("");
  const [journal, setJournal] = useState([]);
  const [ajust, setAjust] = useState({ jours: "", motif: "" });
  const [voirInactifs, setVoirInactifs] = useState(false);
  const [filtre, setFiltre] = useState({ personne: "", statut: "" });
  const [mois, setMois] = useState(auj.slice(0, 7));
  const [moisPaie, setMoisPaie] = useState(auj.slice(0, 7));
  const relanceFaite = useRef(false);

  const maFiche = personnes.find(p => p.email === monEmail) || null;
  const ficheDe = (id) => personnes.find(p => p.id === id);
  const nomDe = (d) => (ficheDe(d.personne_id) || {}).nom || d.demandeur_nom || "?";
  const contratDe = (id) => (ficheDe(id) || {}).contrat;
  const soldeDe = (id) => soldes.find(s => s.personne_id === id);

  async function chargerSoldes(a) {
    const { data, error } = await sb.rpc("rh_soldes", { p_annee: a });
    if (error) throw error;
    setSoldes(data || []);
  }
  async function charger() {
    setChargement(true); setErreur("");
    try {
      const { data: pers, error: ep } = await sb.from("rh_personnes").select("*").order("nom");
      if (ep) throw ep;
      let dem = [];
      for (let from = 0; from < 50000; from += 1000) {
        const { data, error } = await sb.from("rh_demandes").select("*").order("date_debut", { ascending: false }).range(from, from + 999);
        if (error) throw error;
        dem = dem.concat(data || []);
        if (!data || data.length < 1000) break;
      }
      setPersonnes(pers || []); setDemandes(dem);
      await chargerSoldes(annee);
      if (!relanceFaite.current) { relanceFaite.current = true; relancer(); }
    } catch (ex) {
      const m = ex.message || String(ex);
      setErreur("Chargement impossible : " + m + (/rh_/i.test(m) ? " — le script rh_conges.sql (v2) a-t-il été exécuté dans Supabase ?" : ""));
    } finally { setChargement(false); }
  }
  useEffect(() => { charger(); }, []);
  useEffect(() => { chargerSoldes(annee).catch(ex => setErreur(ex.message || String(ex))); }, [annee]);

  // Planning partagé (tout le monde) : qui est absent, sans détail.
  const [an, mo] = mois.split("-").map(Number);
  const debutMois = mois + "-01", finDuMois = finMois(an, mo);
  async function chargerPlanning() {
    const a = debutMois < auj ? debutMois : auj, b = finDuMois > auj ? finDuMois : auj;
    const { data } = await sb.rpc("rh_planning", { p_debut: a, p_fin: b });
    setPlanning(data || []);
  }
  useEffect(() => { chargerPlanning(); }, [mois, demandes]);

  // Relance des responsables : demandes en attente depuis plus de 48 h (un seul envoi par jour).
  async function relancer() {
    const { data } = await sb.rpc("rh_relances");
    if (data && data.nb > 0) {
      emailA(data.approbateurs, "[Congés] Rappel : " + data.nb + " demande(s) en attente depuis plus de 48 h",
        "Demandes de congés en attente",
        [data.nb + " demande(s) de congés (ou d'annulation) attendent une réponse depuis plus de 48 heures."],
        "Voir les demandes");
    }
  }

  // ---------- Formulaire de demande ----------
  function ouvrirForm(opts) {
    const o = opts || {};
    setFormErr(""); setDejaAbsents([]);
    if (o.remplace) {
      const d = o.remplace;
      setForm({ personne_id: d.personne_id, remplace: d, type: d.type, debut: d.date_debut, fin: d.date_fin,
        choix: d.date_debut === d.date_fin ? (d.debut_apres_midi ? "aprem" : d.fin_matin ? "matin" : "jour") : "jour",
        am: d.debut_apres_midi, fm: d.fin_matin, commentaire: d.commentaire || "" });
      return;
    }
    setForm({ personne_id: o.pourAutre ? "" : (maFiche && maFiche.id), pourAutre: !!o.pourAutre, type: "CP", debut: auj, fin: auj, choix: "jour", am: false, fm: false, commentaire: "" });
  }
  const formFlags = (f) => f.debut === f.fin ? { am: f.choix === "aprem", fm: f.choix === "matin" } : { am: f.am, fm: f.fm };
  useEffect(() => {
    if (!form || !form.debut || !form.fin || form.fin < form.debut) { setDejaAbsents([]); return; }
    let ok = true;
    sb.rpc("rh_planning", { p_debut: form.debut, p_fin: form.fin }).then(({ data }) => {
      if (!ok) return;
      const autres = (data || []).filter(x => x.personne_id !== form.personne_id && x.categorie === "absence" && !(form.remplace && x.personne_id === form.remplace.personne_id));
      setDejaAbsents(Array.from(new Set(autres.map(x => x.nom))));
    });
    return () => { ok = false; };
  }, [form && form.debut, form && form.fin, form && form.personne_id]);

  async function soumettre() {
    const f = form; const { am, fm } = formFlags(f);
    if (!f.personne_id) { setFormErr("Choisissez le salarié."); return; }
    if (!f.debut || !f.fin) { setFormErr("Indiquez les dates."); return; }
    if (f.fin < f.debut) { setFormErr("La date de fin est avant la date de début."); return; }
    if (nbJours(f.debut, f.fin, am, fm) <= 0) { setFormErr("Aucun jour ouvré sur ces dates (week-end ou jour férié)."); return; }
    setOccupe(true); setFormErr("");
    const { data, error } = await sb.from("rh_demandes").insert({
      personne_id: f.personne_id, type: f.type, date_debut: f.debut, date_fin: f.fin,
      debut_apres_midi: am, fin_matin: fm, commentaire: f.commentaire.trim() || null,
      remplace_id: f.remplace ? f.remplace.id : null,
    }).select().single();
    setOccupe(false);
    if (error) { setFormErr(error.message); return; }

    if (si === null || js === null) { setFicheErr("Les nombres de jours doivent être des nombres (ex. 2,5)."); return; }

      e('div', { style: { marginTop: 14, background: "#F7F7FB", border: "1px solid #E8E8F0", borderRadius: 8, padding: "10px 12px", fontSize: 13, lineHeight: 1.6 } },
        fi.contrat === "Stage"

// =====================================================================
//  Connexion + double authentification + contrôle d'accès
// =====================================================================
function App() {
  const [session, setSession] = useState(null);
  const [pret, setPret] = useState(false);
  const [mfa, setMfa] = useState("checking");
  const [factorId, setFactorId] = useState(null);
  const [code, setCode] = useState("");
  const [errAuth, setErrAuth] = useState("");
  const [occupe, setOccupe] = useState(false);
  const [role, setRole] = useState(null);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setPret(true); });
    const { data: l } = sb.auth.onAuthStateChange((_ev, s) => setSession(s));
    return () => l.subscription.unsubscribe();
  }, []);

  const jeton = session && session.access_token;
  useEffect(() => {
    if (!session) { setMfa("checking"); setRole(null); return; }
    (async () => {
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (aal && aal.currentLevel === "aal2") { setMfa("ok"); return; }
      const { data: fs } = await sb.auth.mfa.listFactors();
      const v = ((fs && fs.totp) || []).filter(x => x.status === "verified");
      if (v.length) { setFactorId(v[0].id); setMfa("challenge"); } else setMfa("noenroll");
    })();
  }, [jeton]);

  useEffect(() => {
    if (mfa !== "ok") return;
    sb.rpc("rh_role").then(({ data, error }) => setRole(error ? { erreur: error.message } : (data || {})));
  }, [mfa, jeton]);

  async function connexion() {
    setOccupe(true); setErrAuth("");
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setOccupe(false);
    if (error) setErrAuth("Email ou mot de passe incorrect.");
  }
  async function verifier() {
    const c = code.replace(/\s/g, "");
    if (c.length !== 6) { setErrAuth("Entrez le code à 6 chiffres."); return; }
    setOccupe(true); setErrAuth("");
    try {
      const { data: ch, error: e1 } = await sb.auth.mfa.challenge({ factorId });
      if (e1) throw e1;
      const { error: e2 } = await sb.auth.mfa.verify({ factorId, challengeId: ch.id, code: c });
      if (e2) throw e2;
      setCode(""); setMfa("ok");
    } catch (ex) { setErrAuth("Code incorrect ou expiré."); }
    finally { setOccupe(false); }
  }
  const deconnexion = async () => { try { await sb.auth.signOut({ scope: "local" }); } catch (ex) {} setRole(null); };

  const ecranCentre = (contenu) => e('div', { style: { minHeight: "100vh", background: SB, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 } },
    e('div', { style: { width: 400, maxWidth: "100%" } },
      e('div', { style: { textAlign: "center", marginBottom: 22 } },
        e('img', { src: "https://www.dsihotel.com/dsi-logo-gold.png", alt: "DSI Hotel", style: { height: 54 } }),
        e('div', { style: { color: "rgba(255,255,255,.55)", fontSize: 13, marginTop: 8 } }, "Congés & absences — équipe DSI Hotel")),
      e('div', { style: { background: "rgba(255,255,255,.05)", border: "1px solid " + G + "30", borderRadius: 14, padding: 24 } }, contenu)));
  const champSombre = { width: "100%", padding: "10px 13px", background: "rgba(255,255,255,.08)", border: "1px solid " + G + "35", borderRadius: 8, color: "white", fontSize: 14, outline: "none", marginBottom: 12 };
  const btnOr = { width: "100%", padding: 11, background: G, border: "none", color: "#111", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer" };
  const lienPortail = e('a', { href: "/", style: { display: "block", textAlign: "center", marginTop: 14, color: "rgba(255,255,255,.5)", fontSize: 12.5 } }, "← Retour au portail");

  if (!pret) return ecranCentre(e('div', { style: { color: "rgba(255,255,255,.6)", fontSize: 13, textAlign: "center" } }, "Chargement…"));
  if (!session) return ecranCentre(e('div', null,
    e('input', { value: email, onChange: (ev) => setEmail(ev.target.value), placeholder: "prenom@dsihotel.fr", autoComplete: "username", style: champSombre }),
    e('input', { type: "password", value: pw, onChange: (ev) => setPw(ev.target.value), onKeyDown: (ev) => ev.key === "Enter" && connexion(), placeholder: "Mot de passe", autoComplete: "current-password", style: champSombre }),
    errAuth && e('div', { style: { color: "#FC8181", fontSize: 13, marginBottom: 10 } }, errAuth),
    e('button', { onClick: connexion, disabled: occupe, style: { ...btnOr, opacity: occupe ? 0.6 : 1 } }, occupe ? "Connexion…" : "Se connecter"),
    lienPortail));
  if (mfa === "checking") return ecranCentre(e('div', { style: { color: "rgba(255,255,255,.6)", fontSize: 13, textAlign: "center" } }, "Vérification de la sécurité…"));
  if (mfa === "noenroll") return ecranCentre(e('div', { style: { color: "rgba(255,255,255,.75)", fontSize: 13.5, lineHeight: 1.6 } },
    "La double authentification n'est pas encore activée sur votre compte. Connectez-vous d'abord au portail pour l'activer, puis revenez sur cette page.",
    e('a', { href: "/", style: { ...btnOr, display: "block", textAlign: "center", textDecoration: "none", marginTop: 16 } }, "Ouvrir le portail")));
  if (mfa === "challenge") return ecranCentre(e('div', null,
    e('div', { style: { color: G, fontWeight: 600, marginBottom: 6 } }, "🔐 Code de vérification"),
    e('div', { style: { color: "rgba(255,255,255,.6)", fontSize: 12.5, marginBottom: 14 } }, "Saisissez le code à 6 chiffres de votre application d'authentification."),
    e('input', { value: code, onChange: (ev) => { setCode(ev.target.value.replace(/\D/g, "").slice(0, 6)); setErrAuth(""); }, onKeyDown: (ev) => ev.key === "Enter" && verifier(), inputMode: "numeric", autoFocus: true, placeholder: "000000", style: { ...champSombre, fontSize: 22, letterSpacing: 6, textAlign: "center", fontFamily: "monospace" } }),
    errAuth && e('div', { style: { color: "#FC8181", fontSize: 13, marginBottom: 10 } }, errAuth),
    e('button', { onClick: verifier, disabled: occupe || code.length !== 6, style: { ...btnOr, opacity: (occupe || code.length !== 6) ? 0.5 : 1 } }, occupe ? "Vérification…" : "Vérifier"),
    e('button', { onClick: deconnexion, style: { ...btnOr, background: "none", border: "1px solid rgba(255,255,255,.15)", color: "rgba(255,255,255,.55)", marginTop: 10, fontWeight: 400 } }, "Se déconnecter")));
  if (!role) return ecranCentre(e('div', { style: { color: "rgba(255,255,255,.6)", fontSize: 13, textAlign: "center" } }, "Chargement…"));
  if (role.erreur || !role.staff) return ecranCentre(e('div', { style: { color: "rgba(255,255,255,.8)", fontSize: 13.5, lineHeight: 1.6 } },
    role.erreur ? "Erreur : " + role.erreur + (/rh_role/i.test(role.erreur) ? " — le script rh_conges.sql n'a pas encore été exécuté dans Supabase." : "")
                : "Cette page est réservée aux membres de l'équipe DSI Hotel.",
    e('button', { onClick: deconnexion, style: { ...btnOr, marginTop: 16 } }, "Se déconnecter"), lienPortail));

  return e('div', { style: { minHeight: "100vh" } },
    e('div', { style: { background: SB, color: "white", padding: "12px 20px", display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", position: "sticky", top: 0, zIndex: 50 } },
      e('img', { src: "https://www.dsihotel.com/dsi-logo-gold.png", alt: "DSI Hotel", style: { height: 34 } }),
      e('div', { style: { fontSize: 15, fontWeight: 700, color: G } }, "Congés & absences"),
      role.manager && pastille(role.approbateur ? "Responsable — validation" : "Vue équipe", "#111", G),
      e('div', { style: { marginLeft: "auto", fontSize: 12.5, color: "rgba(255,255,255,.7)" } }, session.user.email),
      e('a', { href: "/", style: { color: "rgba(255,255,255,.75)", fontSize: 12.5, textDecoration: "none", border: "1px solid rgba(255,255,255,.2)", borderRadius: 7, padding: "5px 10px" } }, "← Portail"),
      e('button', { onClick: deconnexion, style: { color: "rgba(255,255,255,.75)", fontSize: 12.5, background: "none", border: "1px solid rgba(255,255,255,.2)", borderRadius: 7, padding: "5px 10px", cursor: "pointer" } }, "Déconnexion")),
    e('div', { style: { maxWidth: 1200, margin: "0 auto", padding: "20px 16px 40px" } },
      e(RH, { session, role })));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
